resources:
  pipelines:
    retail_medallion_pipeline:
      name: "${bundle.target} - Einkaufpark Retail Medallion"

      catalog: ${var.catalog}
      schema: ${resources.schemas.retail_bronze_schema.name}

      serverless: true
      continuous: false
      edition: ADVANCED
      channel: CURRENT

      parameters:
        transactions_path: "/Volumes/${var.catalog}/${var.raw_schema}/${var.input_volume}/transactions"

        returns_path: "/Volumes/${var.catalog}/${var.raw_schema}/${var.input_volume}/returns"

        customers_path: "/Volumes/${var.catalog}/${var.raw_schema}/${var.input_volume}/dimensions/dim_customers.csv"

        stores_path: "/Volumes/${var.catalog}/${var.raw_schema}/${var.input_volume}/dimensions/dim_stores.csv"

        products_path: "/Volumes/${var.catalog}/${var.raw_schema}/${var.input_volume}/dimensions/dim_products.csv"

        products_scd2_path: "/Volumes/${var.catalog}/${var.raw_schema}/${var.input_volume}/dimensions/dim_products_scd2.csv"

        price_tolerance_eur: ${var.price_tolerance_eur}
        revenue_tolerance_eur: ${var.revenue_tolerance_eur}
        max_return_window_days: ${var.max_return_window_days}

      libraries:
        - file:
            path: ../pipelines/00_bronze.sql

        - file:
            path: ../pipelines/10_silver_dimensions.sql

        - file:
            path: ../pipelines/11_silver_sales.sql

        - file:
            path: ../pipelines/12_silver_returns.sql

        - file:
            path: ../pipelines/13_silver_quality.sql

        - file:
            path: ../pipelines/20_gold_baskets.sql

        - file:
            path: ../pipelines/21_gold_sales_stores.sql

        - file:
            path: ../pipelines/22_gold_products.sql

        - file:
            path: ../pipelines/23_gold_customers_returns_traffic.sql

        - file:
            path: ../pipelines/24_gold_quality.sql