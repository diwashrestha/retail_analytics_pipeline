resources:
  pipelines:
    retail_medallion_pipeline:
      name: "${bundle.target} - Einkaufpark Bronze and Silver"
      catalog: ${var.catalog}
      schema: ${resources.schemas.retail_bronze_schema.name}
      serverless: true
      continuous: false
      edition: ADVANCED
      channel: CURRENT

      parameters:
        # Bronze landing paths.
        transactions_path: "/Volumes/${var.catalog}/${resources.schemas.retail_raw_schema.name}/${resources.volumes.retail_raw_volume.name}/transactions"
        returns_path: "/Volumes/${var.catalog}/${resources.schemas.retail_raw_schema.name}/${resources.volumes.retail_raw_volume.name}/returns"
        stores_path: "/Volumes/${var.catalog}/${resources.schemas.retail_raw_schema.name}/${resources.volumes.retail_raw_volume.name}/dimensions/dim_stores.csv"
        customers_path: "/Volumes/${var.catalog}/${resources.schemas.retail_raw_schema.name}/${resources.volumes.retail_raw_volume.name}/dimensions/dim_customers.csv"
        products_path: "/Volumes/${var.catalog}/${resources.schemas.retail_raw_schema.name}/${resources.volumes.retail_raw_volume.name}/dimensions/dim_products.csv"
        product_prices_path: "/Volumes/${var.catalog}/${resources.schemas.retail_raw_schema.name}/${resources.volumes.retail_raw_volume.name}/dimensions/dim_products_scd2.csv"

        # Cross-schema identifiers used by the Silver SQL source files.
        bronze_catalog: ${var.catalog}
        bronze_schema: ${resources.schemas.retail_bronze_schema.name}
        silver_catalog: ${var.catalog}
        silver_schema: ${resources.schemas.retail_silver_schema.name}

        # Business-rule tolerances. Pipeline parameter values are strings.
        price_tolerance_eur: "0.02"
        revenue_tolerance_eur: "0.02"
        max_return_window_days: "30"

      libraries:
        - file:
            path: ../pipelines/00_bronze.sql
        - file:
            path: ../pipelines/10_silver_dimensions.sql
        - file:
            path: ../pipelines/11_silver_sales.sql
        - file:
            path: ../pipelines/12_silver_returns.sql
        - file:
            path: ../pipelines/13_silver_quality.sql
