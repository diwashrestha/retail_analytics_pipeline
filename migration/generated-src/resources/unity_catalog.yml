resources:
  schemas:
    retail_raw_schema:
      name: ${var.raw_schema}
      catalog_name: ${var.catalog}
      comment: Raw landing schema for Einkaufpark generated files.

    retail_bronze_schema:
      name: ${var.bronze_schema}
      catalog_name: ${var.catalog}
      comment: Source-aligned Bronze tables and quarantine datasets.

    retail_silver_schema:
      name: ${var.silver_schema}
      catalog_name: ${var.catalog}
      comment: Trusted conformed facts, dimensions, and review datasets.

    retail_gold_schema:
      name: ${var.gold_schema}
      catalog_name: ${var.catalog}
      comment: Business-ready analytical aggregates and quality datasets.

    retail_reporting_schema:
      name: ${var.reporting_schema}
      catalog_name: ${var.catalog}
      comment: Optional Power BI-facing SQL views over trusted Gold datasets.

  volumes:
    retail_raw_volume:
      name: ${var.raw_volume}
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.retail_raw_schema.name}
      volume_type: MANAGED
      comment: Managed landing volume for generated Einkaufpark CSV files.
