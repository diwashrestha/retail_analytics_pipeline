bundle:
  name: einkaufpark-retail-platform

include:
  - resources/*.yml

sync:
  include:
    - data_generator/**
    - master/**
    - notebooks/**
    - pipelines/**

experimental:
  skip_name_prefix_for_schema: true

variables:
  catalog:
    description: Unity Catalog catalog.
    default: workspace

  raw_schema:
    description: Schema containing the managed raw Volume.
    default: retail_dev_raw

  bronze_schema:
    description: Bronze target schema.
    default: retail_dev_bronze

  silver_schema:
    description: Silver target schema.
    default: retail_dev_silver

  gold_schema:
    description: Gold target schema.
    default: retail_dev_gold

  reporting_schema:
    description: Power BI reporting schema.
    default: retail_dev_reporting

  input_volume:
    description: Managed Volume containing generated CSV files.
    default: retail_input

  price_tolerance_eur:
    description: Maximum allowed unit-price difference.
    default: "0.02"

  revenue_tolerance_eur:
    description: Maximum allowed revenue calculation difference.
    default: "0.02"

  max_return_window_days:
    description: Maximum accepted number of days between sale and return.
    default: "30"

  demo_records:
    description: Number of transaction lines in the standard demo.
    default: "100000"

  demo_customers:
    description: Number of generated customers.
    default: "10000"

  generator_seed:
    description: Fixed random seed for reproducible demo data.
    default: "42"

  demo_start_date:
    description: First business date generated for the demo.
    default: "2023-01-01"

  demo_end_date:
    description: Last business date generated for the demo.
    default: "2026-03-31"

  price_history_end_date:
    description: Final date covered by product SCD2 prices.
    default: "2026-12-31"
  
  default_walkin_rate:
    default: "0.10"
  
  default_late_rate:
    default: "0.05"
  
  default_return_rate:
    default: "0.04"
  
  default_duplicate_rate:
    default: "0.001"

targets:
  dev:
    mode: development
    default: true

    presets:
      pipelines_development: true
      trigger_pause_status: PAUSED

    variables:
      catalog: workspace
      raw_schema: retail_dev_raw
      bronze_schema: retail_dev_bronze
      silver_schema: retail_dev_silver
      gold_schema: retail_dev_gold
      reporting_schema: retail_dev_reporting
      input_volume: retail_input

  release:
    mode: production

    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

    presets:
      pipelines_development: false
      trigger_pause_status: PAUSED

    variables:
      catalog: workspace
      raw_schema: retail_raw
      bronze_schema: retail_bronze
      silver_schema: retail_silver
      gold_schema: retail_gold
      reporting_schema: retail_reporting
      input_volume: retail_input